version: '3.8'

services:
  # Database Storage (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: secure-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_gateway
      POSTGRES_USER: secure_gateway_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432" # Bind host port 5433 to container port 5432 to prevent local conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_gateway_user -d secure_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporary Session Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: secure-gateway-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring API Service
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: sg-monitoring
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      MONITORING_PORT: 3001
      DATABASE_URL: postgres://secure_gateway_user:change_me@postgres:5432/secure_gateway
      ALERT_FAILURE_THRESHOLD: 5
      ALERT_FAILURE_WINDOW_SECONDS: 300
      ALERT_BLOCK_THRESHOLD: 3
      ALERT_BLOCK_WINDOW_SECONDS: 300
      ALERT_COOLDOWN_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy

  # Metrics Scraper (Prometheus)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sg-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - monitoring

  # Visual Dashboards (Grafana)
  grafana:
    image: grafana/grafana:10.0.3
    container_name: sg-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Secure SSH Target Container
  target-server:
    build:
      context: ./docker/target-server
    container_name: secure-target-server
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
      USER_NAME: employee
      USER_PASSWORD: employee123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    ports:
      - "2223:2222"

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
