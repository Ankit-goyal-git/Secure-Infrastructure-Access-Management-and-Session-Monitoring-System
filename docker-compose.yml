version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secure-gateway-db
    environment:
      POSTGRES_DB: secure_gateway
      POSTGRES_USER: secure_gateway_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432" # Bind host port 5433 to container port 5432 to prevent local conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: secure-gateway-cache
    ports:
      - "6379:6379"

  target-server:
    build:
      context: ./docker/target-server
    container_name: secure-target-server
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
      USER_NAME: employee
      USER_PASSWORD: employee123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    ports:
      - "2223:2222"

volumes:
  pgdata:
